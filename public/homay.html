.lt.is-open .lt-it{opacity:1;transform:translateY(0) rotate(var(--r))}
.lt.is-open .lt-pol{transition-delay:.18s,.18s,0s,0s}.lt.is-open .lt-tix{transition-delay:.24s,.24s,0s,0s}.lt.is-open .lt-pc{transition-delay:.3s,.3s,0s,0s}
.lt.is-open .lt-it:hover{transform:translateY(-3cqw) rotate(var(--r))}
.lt.is-open .lt-it.on{transform:translateY(-7cqw) rotate(0deg);box-shadow:0 0 0 2px var(--pink),0 10px 20px rgba(0,0,0,.35);transition-delay:0s}
.lt.has-sel .lt-it:not(.on){filter:brightness(.82) saturate(.7)}
.lt-it:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
.lt-img{position:relative;flex:1;min-height:0;overflow:hidden}
.lt-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lt-tag{position:absolute;top:-1.6cqw;left:50%;transform:translateX(-50%);z-index:1;padding:.5cqw 1.8cqw;border-radius:999px;background:#2B221C;color:#FFF6E8;font-size:max(10px,var(--fs));font-weight:var(--fw-semibold);white-space:nowrap}
.lt-pol{--r:-2deg;background:#FFFDF8;padding:1.8cqw 1.8cqw 0;border-radius:2px}
.lt-hand{display:block;padding:1.3cqw 0 9cqw;font-family:"Segoe Print","Bradley Hand","Noteworthy","Comic Sans MS",cursive;font-size:max(9px,2.6cqw);text-align:center;color:#4B3F36;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-tix{--r:0deg;background:#F7E9CC;padding:2cqw 2.3cqw 9cqw;border-radius:3px}
.lt-tix .lt-img{margin:1.2cqw 0;border-radius:2px}
.lt-tix .lt-img img{object-position:78% 50%}
.lt-tl{display:block;font-family:var(--font-mono);font-size:max(8px,2.2cqw);letter-spacing:.06em;text-transform:uppercase;color:#8A3B12;border-bottom:1px dashed rgba(138,59,18,.45);padding:1.8cqw 0 .9cqw}
.lt-tl2{border-bottom:0;border-top:1px dashed rgba(138,59,18,.45);padding:.9cqw 0 0;color:#6E6158}
.lt-pc{--r:2deg;padding:1.6cqw 1.6cqw 9cqw;border-radius:2px;background:repeating-linear-gradient(135deg,#C8372D 0 6px,#FFFDF8 6px 12px,#25469A 12px 18px,#FFFDF8 18px 24px)}
.lt-pc .lt-img{border:1.5cqw solid #FFFDF8;border-bottom:0}
.lt-pc .lt-img img{object-position:50% 20%}
.lt-lines{display:block;flex:none;height:7cqw;border:1.5cqw solid #FFFDF8;border-top:0;background:#FFFDF8 repeating-linear-gradient(#FFFDF8 0 1.9cqw,#D8CBB8 1.9cqw calc(1.9cqw + 1px))}
.lt-cap{display:flex;flex-direction:column;gap:6px;min-height:52px}
.lt-cap p{margin:0;font-size:var(--fs-body-sm);line-height:var(--lh-body-sm);color:var(--muted);text-align:center}
.lt-acts{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.lt-link{padding:0 0 1px;border:0;border-bottom:1px solid var(--pink);background:none;font:inherit;font-size:var(--fs-body-sm);color:var(--ink);cursor:pointer}
.lt-reset{border-bottom-color:var(--line);color:var(--muted)}
.lt-link:hover{color:var(--pink)}
.lt-link:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@container (max-width:520px){.lt{height:100cqw;--ew:92cqw;--el:4cqw;--et:23cqw;--ot:25cqw;--os:.92;--iw:30.7cqw;--ih:47.3cqw;--ig:2.4cqw;--it:-16.5cqw;--fs:3.2cqw}.lt-open{padding-bottom:6cqw}}

<p style="margin: 0; font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); max-width: 620px">A monthly interactive letter for Iranians living abroad, bringing a little piece of home to wherever they are. I write, design, and build each issue, learning from readers as Homay evolves.</p>

<section class="qs" aria-label="Summary">
<div><span class="qs-k">The idea</span><p>A monthly <strong>mail club for Iranians abroad</strong>: a small, familiar piece of home.</p></div>
<div><span class="qs-k">The challenge</span><p>I was a <strong>digital nomad</strong> in Southeast Asia, and my readers lived across many countries.</p></div>
<div><span class="qs-k">The experiment</span><p>A <strong>digital letter first</strong>: two issues, a survey after each, and 10 of 11 November readers want the next one.</p></div>
</section>

<!-- 1 -->
<section id="c1" class="cs-sec">
<span class="ask"><b>1</b>Where did it start?</span>
<h2 class="h2">It started long before Homay.</h2>
<p class="lead">I’ve always loved making things. Stories, photographs, visuals: anything that could turn an idea into something people could experience.</p>
<p class="lead">Years later, product design gave me a way to connect those interests. And with AI making experimentation more accessible, I finally had the chance to <strong>bring them together in something of my own</strong>.</p>
<p class="lead">Then I came across mail clubs: a letter, cards and small surprises that arrive every month. I loved the idea of making something people look forward to. And I knew who I wanted to write to: <strong>Iranians living abroad</strong>, for whom a small, familiar piece of home might mean something.</p>
<figure class="cs-wide" style="margin: 0; display: flex; flex-direction: column; gap: 10px">
<div class="card" style="padding: 8px"><img src="/assets/d68004ba38c5b478daaf064ad99b2670.jpg" alt="Maryam working on Homay-nameh at her laptop in a café, headphones around her neck" loading="lazy" style="display: block; width: 100%; height: auto; border-radius: var(--r-md)"></div>
<figcaption class="cap" style="margin: 0">Writing, designing and building, one evening at a time.</figcaption>
</figure>
</section>

<!-- 2 -->
<section id="c2" class="cs-sec">
<span class="ask"><b>2</b>Why digital?</span>
<h2 class="h2">The dream met reality.</h2>
<p class="lead">My first idea was a <strong>physical mail club</strong>: a real envelope every month, with something familiar from home inside.</p>
<p class="lead">But I was living as a digital nomad in Southeast Asia, and the people I wanted to write to <strong>were spread across many countries</strong>. Printing, packaging and international shipping would add cost and complexity before I knew whether anyone wanted the letter at all.</p>

<p class="lead">So instead of investing in physical production before testing the idea, <strong>I started with a digital version</strong>. The physical mail club is still a long-term possibility, not a promise.</p>
</section>

<section id="c3" class="cs-sec">
<span class="ask"><b>3</b>What could digital add?</span>
<p class="quote">What if I could preserve the feeling of receiving a letter, <span style="color: var(--pink)">while using everything digital can offer?</span></p>
<p class="lead">I didn’t want a PDF pretending to be paper. I wanted to understand what makes a letter special, then use the screen to recreate it, and go further.</p>

<section id="c4" class="cs-sec">
<span class="ask"><b>4</b>What did I build first?</span>
<h2 class="h2">The first letter was an experiment.</h2>
<p class="lead">The first issue went out in <strong>October 2026</strong>. I deliberately started small: publish something real, find a first group of readers, and learn whether the experience resonated at all.</p>
<figure class="zfig cs-wide" style="margin: 0"><div class="zw"><img src="/assets/2f792ff1509f1f09048b9f1735cc707f.jpg" alt="The opening of the October issue on desktop: the Homay-nameh title with a ladybird and an autumn moon, a welcome note from Homay, and four illustrated cards for October occasions" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>October 2026</b> · the opening of the first issue on desktop: a welcome note from Homay and the month’s occasions</figcaption></figure>
<div class="built cs-wide">
<div><span class="built-ic" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.3-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3M14 17.7V21M7 18a6 6 0 0 0 3.8-5.6V9"/></svg></span><b>A character</b><span>Homay, the club’s bird, writes every issue and talks to readers as they explore, so the letter has a sender.</span></div>

<figure class="zfig cs-wide" style="margin: 0"><div class="zw"><img src="/assets/c3614233253e48dfa82cce70d76e5abc.jpg" alt="Four phone screens from the October issue: the cover with the welcome note and occasions, the monthly missions, film night, and the photo story" loading="lazy" style="aspect-ratio: 3912/2092"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>October 2026</b> · the first issue on a phone: cover, missions, film night and the photo story</figcaption></figure>
<h3 class="hm-sub">What 17 readers said</h3>
<div class="st cs-wide">
<div class="st-c"><b class="pk">16/16</b><span>of the 16 who answered <strong>want the next issue</strong></span></div>
<div class="st-c"><b>9/17</b><span>discover content like this on <strong>Instagram or Telegram</strong></span></div>
<div class="st-c"><b>3/17</b><span>found it <strong>hard to find</strong> the sections they liked</span></div>
</div>
<p class="cap" style="margin-top: 0">October reader survey · 17 responses, not every question answered by everyone · Oct 20–26, 2026</p>
<p class="lead">Readers described a mood more than the content. In the written comments, <strong>music came up more than anything else</strong>. A small first group, not a representative sample, but enough to show what worked and where reading got harder.</p>

<div class="card" style="font-size: var(--fs-body); line-height: var(--lh-body)"><p style="margin: 0; font-weight: var(--fw-semibold)">“More than the content itself, I loved the atmosphere it created.”</p><small class="mono" style="display: block; margin-top: 10px; font-size: var(--fs-caption); color: var(--muted)">Reader, translated from Persian</small></div>
<div class="card" style="font-size: var(--fs-body); line-height: var(--lh-body)"><p style="margin: 0; font-weight: var(--fw-semibold)">“The way it made me feel was so beautiful... a feeling of being part of something, a sense of connection.”</p><small class="mono" style="display: block; margin-top: 10px; font-size: var(--fs-caption); color: var(--muted)">Reader, written in English</small></div>

<section id="c5" class="cs-sec">
<span class="ask"><b>5</b>What changed?</span>
<h2 class="h2">One month later, a different letter.</h2>
<p class="lead">For November I tried a new direction: <strong>one issue, one Iranian city</strong>. The first was Rasht, a rainy city in the north known for its food and its fish market.</p>
<p class="lead">Not a tourist guide, but a small, personal visit: regional music and ambient sound, a local phrase, a recipe, stories and facts, films and a podcast, games and a quiz.</p>
<figure class="zfig cs-wide" style="margin: 0"><div class="zw"><img src="/assets/0cce2e0f3c6ef9da41941b08e7379500.jpg" alt="The opening of the November issue on desktop: the Homay-nameh November title, an illustrated Rasht town hall with photos of kaka cookies and the square, and buttons to start the trip or open the travel index" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>November 2026</b> · the opening of the issue on desktop: Rasht, with buttons to start the trip or open the travel index</figcaption></figure>
<h3 class="hm-sub">From notebook to issue</h3>
<p class="lead">November started on paper. I mapped everything Rasht could offer, dropped the monthly occasions, and narrowed the map to a numbered list of stops before designing a screen.</p>
<div class="sk2 cs-wide">
<figure class="zfig sk-big"><div class="zw"><img src="/assets/42168668e9771f04264fae55ad6e9745.jpg" alt="Notebook sketch: a mind map of Rasht with food, music, the bazaar, dialect and films around it; on the left page, the monthly occasions boxes crossed out" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Mapping Rasht.</b> Everything the city could offer, with the old monthly-occasions layout crossed out.</figcaption></figure>
<div class="sk-row">
<figure class="zfig "><div class="zw"><img src="/assets/b36c2d957ef2f8ad1647eea9c5b5cb10.jpg" alt="Notebook sketch: a numbered list of section ideas, starting with music, a local phrase and the kaka recipe" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Choosing the stops</b></figcaption></figure>

<h3 class="hm-sub">October → November</h3>
<p class="lead">What I observed in October, what I changed, and why. These are responses to feedback, not proven improvements; chapter 6 has what readers said next.</p>
<div class="cmp cs-wide">
<div class="cmp-r cmp-h" aria-hidden="true"><span></span><span>Observed</span><span>Changed</span><span>Why</span></div>
<div class="cmp-r"><p class="cmp-k">Reading</p><p>9 of 17 discover similar content on Instagram or Telegram</p><p class="cmp-c">Phone-first layout, big tap targets</p><p>Fit where readers already discover things</p></div>
<div class="cmp-r"><p class="cmp-k">Content</p><p>Readers wanted more depth</p><p class="cmp-c">One city, ten stops</p><p>Depth over headlines</p></div>
<div class="cmp-r"><p class="cmp-k">Navigation</p><p>3 of 17 couldn’t find sections</p><p class="cmp-c">Contents page and travel index</p><p>Easy to find and revisit</p></div>
<div class="cmp-r"><p class="cmp-k">Participation</p><p>Missions felt like paperwork</p><p class="cmp-c">Five hidden stamps to find</p><p>Play, not tasks</p></div>
<div class="cmp-r"><p class="cmp-k">Sound</p><p>Music came up most in comments</p><p class="cmp-c">Rain, wood fire and Gilaki songs</p><p>Sound carries a place</p></div>
</div>
<div class="nv cs-wide">
<figure class="zfig nv-d"><div class="zw"><img src="/assets/d059b9539756cc5d1d2265f6b3035f47.jpg" alt="Photo story on desktop with the photo pinned beside the text" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Desktop</b> · the photo stays beside the story</figcaption></figure>
<figure class="zfig nv-m"><div class="zw"><img src="/assets/e9b8ea1c00c7d07ffd4c6294761c0bf5.jpg" alt="November cover on a phone" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Phone</b> · the cover</figcaption></figure>

</div>
</section>

<!-- 6 -->
<section id="c6" class="cs-sec">
<span class="ask"><b>6</b>Where is it going?</span>
<h2 class="h2">Still writing the next chapter.</h2>
<p class="lead">November ended with a survey asking readers to compare the two issues. <strong>9 of 11 liked November more</strong>, 1 saw no difference and 1 preferred October. Encouraging early feedback from a small group, not proof that the redesign works.</p>
<div class="two cs-wide hm-find">
<div class="card" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card2); border-radius: var(--r-md)"><div><strong style="display: block; font-size: var(--fs-body)">Readers showed interest in city-focused issues</strong><small style="color: var(--muted); font-size: var(--fs-body-sm)">7 of 10 who answered find a city theme very appealing; 3 like it some of the time.</small></div><b class="mono" style="flex: none; font-size: var(--fs-body); color: var(--pink); font-weight: var(--fw-semibold); white-space: nowrap">7/10</b></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; background: var(--card2); border-radius: var(--r-md)"><div><strong style="display: block; font-size: var(--fs-body)">Early interest in cooking along</strong><small style="color: var(--muted); font-size: var(--fs-body-sm)">2 made the kaka; 6 more said they plan to. In October, 5 of 17 completed a mission.</small></div><b class="mono" style="flex: none; font-size: var(--fs-body); color: var(--pink); font-weight: var(--fw-semibold); white-space: nowrap">2/11</b></div>
</div>
<figure class="card hm-bars" style="margin: 0">
<p class="hb-h">November favourites <small>Top four sections readers named, out of 11; several answers allowed</small></p>
<ol class="hb" aria-label="November favourite sections, out of 11 readers">
<li><span class="hb-n">Photo story</span><span class="hb-t"><span class="hb-b" style="width: 72.7%"></span></span><span class="hb-v">8/11</span></li>
<li><span class="hb-n">Rasht music and sounds</span><span class="hb-t"><span class="hb-b" style="width: 63.6%"></span></span><span class="hb-v">7/11</span></li>
<li><span class="hb-n">A phrase in Rashti</span><span class="hb-t"><span class="hb-b" style="width: 63.6%"></span></span><span class="hb-v">7/11</span></li>
<li><span class="hb-n">Kaka recipe</span><span class="hb-t"><span class="hb-b" style="width: 54.5%"></span></span><span class="hb-v">6/11</span></li>
</ol>
<figcaption class="cap">Also named: quiz, dinner table and podcast (5 each), films (3). November reader survey · 11 responses.</figcaption>
</figure>
</div>
<div class="cs-wide" style="display: flex; align-items: center; gap: 18px; background: var(--ink); color: var(--on-ink); border-radius: var(--r-lg); padding: 20px 22px; flex-wrap: wrap">
<b style="font-weight: var(--fw-semibold); font-size: var(--fs-h1); letter-spacing: var(--ls-h1); line-height: var(--lh-h1); color: var(--pink); white-space: nowrap">10/11</b>
<p style="margin: 0; font-size: var(--fs-body-sm); flex: 1 1 260px; opacity: 0.9">want the next letter after November; one isn’t sure yet. After October, it was 16 of 16 who answered.</p>
</div>
<h3 class="hm-sub">What I’m still learning</h3>
<ul class="hm-q">
<li>Which content resonates most, beyond two issues?</li>
<li>Which countries my readers are actually in. The sign-up asks, so I can start answering this.</li>
<li>Which formats make people come back?</li>
<li>How can readers take a bigger part?</li>
<li>Is there enough lasting interest for a physical version?</li>
</ul>
<p class="cap" style="margin-top: 0">Open questions, not completed research.</p>
<h3 class="hm-sub">Could it sustain itself?</h3>
<div class="three cs-wide hm-biz">
<div class="card"><b>Subscription</b><p>Readers pay for future issues or extra experiences.</p></div>
<div class="card"><b>Paid community</b><p>A membership built around culture, shared interests and taking part.</p></div>
<div class="card"><b>Brand partnerships</b><p>A few carefully chosen partners that fit the readers and the project.</p></div>
</div>
<p class="cap" style="margin-top: 0">Business hypotheses, not existing revenue.</p>
<p class="lead">The physical mail club hasn’t gone away. I may explore it once I understand the readers, where they live, and what production and shipping would take. Until then, the digital letter isn’t a placeholder; it’s a product with its own strengths.</p>
<p class="quote" style="font-size: var(--fs-h3, 22px); line-height: 1.4">Homay started with a physical letter I couldn’t send. Going digital didn’t make the idea smaller. It gave me new ways to tell stories, connect with readers and keep experimenting. <span style="color: var(--pink)">I’m still figuring out what Homay can become, and that’s part of why I love building it.</span></p>
</section>
