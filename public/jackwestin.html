/* ── Case-study layout system (shared by every case study) ── */
:root{--cs-page:1200px;--cs-read:760px;--cs-pad:16px}
/* Page container: centred, one width for every case study */
.cs-page{width:100%;max-width:var(--cs-page);margin-inline:auto;box-sizing:border-box}
/* Reading column: everything is left-aligned on the page grid and capped at the reading width… */
.cs-page > :where(:not(section):not(.cs-wide)),
.cs-page > section.card,
.cs-page section > :where(:not(.cs-wide)){max-width:var(--cs-read)}
.cs-page section:not(.card){max-width:none}
.cs-col{max-width:var(--cs-read)}
/* …except wide visuals (hero, screenshot galleries, boards, comparisons), which use the full page width */
.cs-page .cs-wide{width:100%;max-width:none;margin-inline:0;align-self:stretch;box-sizing:border-box}
/* Shared vertical rhythm: section-to-section and inside-section spacing */
:root{--cs-sec:clamp(56px,7vw,80px);--cs-gap:20px}
.cs-page section.cs-sec{padding-top:var(--cs-sec);display:flex;flex-direction:column;gap:var(--cs-gap);scroll-margin-top:80px}
.cs-page .nx{margin-top:var(--cs-sec)}

--fs-body-lg:clamp(16px,1.25vw,17px);--fs-body:15px;--lh-body:1.65;--fs-body-sm:13.5px;--lh-body-sm:1.6;--fs-caption:12.5px;--fs-overline:11px;
--r-xs:0px;--r-sm:0px;--r-md:0px;--r-lg:0px;--r-xl:0px;--r-pill:0px;--btn-r:0px;--btn-r-sm:0px;
--px-b:2px;

--px-frame:0 calc(-1*var(--px-b)) 0 0 var(--px-line),0 var(--px-b) 0 0 var(--px-line),calc(-1*var(--px-b)) 0 0 0 var(--px-line),var(--px-b) 0 0 0 var(--px-line);
--px-drop:5px 5px 0 0 color-mix(in srgb,var(--ink) 12%,transparent);
--px-sh-off:4px;--px-sh-primary:#777777;--px-sh-secondary:#454545;--px-sh-accent:#7B173F;--px-btn-edge:color-mix(in srgb,var(--ink) 28%,transparent);
--px-accent:var(--pink,#FF0062);

}
/* --- Base surface: sharp corners everywhere, a faint 8-bit dot grid, crisp selection --- */

html.sd-pixel :is(.dark,.light){font-family:var(--px-body)!important;background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.2px)!important;background-size:12px 12px!important}

<p style="margin: 0; font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); max-width: 620px">Preparing for the MCAT means working toward a date that doesn’t move: exam day. I designed a Calendar that brings course commitments into one place, so students can see what’s ahead, what they’ve missed and what to focus on next.</p>
<div><a class="chip-live" href="https://jackwestin.com/" target="_blank" rel="noopener">Visit Jack Westin<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a></div>

<div class="sum"><span>My role</span><p>Product designer, end to end, working with a PM and a front-end engineer.</p></div>

<!-- 1 PROBLEM -->
<section id="c1" class="jchap cs-sec">
<p class="jkick">01 · The challenge</p>
<h2 class="h2">An exam date, but no clear view of the weeks ahead.</h2>
<p class="lead">Students preparing for the MCAT have a target exam date. Along the way, their Live course sets its own <strong>instructor-defined deadlines</strong> for assignments and live sessions, and keeping track of all of it isn’t always straightforward.</p>
<p class="lead">The existing Jack Westin dashboard already brought together course content, assignments and live sessions. But these activities sat in <strong>separate sections</strong>, without a unified view of how they fit into a student’s day and week.</p>
<div class="old cs-wide">
<figure class="zfig old-main">
<div class="annot zw">
<img src="/assets/cb1ba5bc8d8e6b689e2bf111f29003d3.jpg" alt="The previous Jack Westin dashboard: Study now with course progress, Upcoming live sessions in the right sidebar, and Assignments grouped into Overdue and Upcoming dates" loading="lazy">
<span class="pin" style="left: 19.5%; top: 32.7%" aria-hidden="true">01</span>
<span class="pin" style="left: 70.6%; top: 9%" aria-hidden="true">02</span>
<span class="pin" style="left: 19.5%; top: 52.4%" aria-hidden="true">03</span>
<button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button>
</div>
<figcaption><b>The previous dashboard</b> · top of the page. Topic insights, study by subject and flashcards sat further down.</figcaption>
</figure>
<ol class="old-notes">
<li><b>01</b><span><strong>Study now</strong>Students could open course content and track their progress.</span></li>
<li><b>02</b><span><strong>Live sessions</strong>Upcoming classes appeared separately in the sidebar.</span></li>
<li><b>03</b><span><strong>Assignments</strong>Grouped into Overdue and Upcoming lists by date, but it was hard to see how the workload spread across days and weeks.</span></li>
</ol>
</div>
<div class="old-det cs-wide">
<figure class="zfig" style="flex: 0.46 1 0"><div class="zw"><img src="/assets/29bd6bf8d3b24985722b31798d681c03.jpg" alt="Upcoming live sessions sidebar with three session cards, Count me in and You’re in buttons" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>02</b> · live sessions in the sidebar</figcaption></figure>
<figure class="zfig" style="flex: 1.315 1 0"><div class="zw"><img src="/assets/e9a6919c3fb91dc7641a31e13a3f3507.jpg" alt="Assignments list: Today’s Dailies, then Overdue and Upcoming dates, each collapsed with a completion count" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>03</b> · assignments as collapsed date lists</figcaption></figure>
</div>
<p class="lead">Picture a student returning after a few days away. The information was all there; the hard part was understanding <strong>what needed attention first, what they’d missed, and what was coming next</strong>.</p>
<p class="hmw"><small>The design challenge</small>How might we organize existing course information into <strong>one clear, time-based view</strong>?</p>
</section>

<!-- 2 UNDERSTANDING -->
<section id="c2" class="jchap cs-sec">
<p class="jkick">02 · Understanding the experience</p>
<h2 class="h2">The information existed. It just wasn’t connected.</h2>
<p class="lead">Before deciding what to build, I mapped how the existing dashboard organized each kind of content. Course progress, assignments and live sessions each had <strong>their own section</strong>, and nothing placed them on a shared timeline of days and weeks.</p>
<div class="ia cs-wide">
<div class="ia-col"><p class="ia-h">Before</p>
<div class="ia-box"><b>Study now</b><span>Course content · progress</span></div>
<div class="ia-box"><b>Assignments</b><span>Overdue and upcoming, listed by date</span></div>
<div class="ia-box"><b>Live sessions</b><span>Upcoming, in the sidebar</span></div>
<p class="ia-cap">Separate sections on one page. The student connects them.</p></div>
<div class="ia-col ia-after"><p class="ia-h">After</p>
<div class="ia-src"><b>One course schedule</b><span>Assignments, sessions and recordings with one completion state</span></div>
<div class="ia-out"><div class="ia-box"><b>Calendar</b><span>When</span></div><div class="ia-box"><b>Assignments</b><span>What next</span></div><div class="ia-box"><b>Dashboard · Learn</b><span>Where they already are</span></div></div>
<p class="ia-cap">One source, shown where each question is asked.</p></div>
</div>
<p class="lead">Live course students work to <strong>fixed, instructor-set deadlines</strong>, and missing a class means finding its recording. So the core questions were about time and status: what’s due, what’s late, and what’s next.</p>
<h3 class="h3x">What other calendars taught me</h3>
<p class="lead">With the problem mapped, I looked at how planning tools handle time and tasks together. I benchmarked nine calendar and planning products; four patterns shaped the Calendar concept.</p>
<div class="pat cs-wide">
<figure><img src="/assets/45f55f8a525ca6e3b9f69abbbe9a831f.jpg" alt="Google Calendar week view with all-day events above the hourly grid" loading="lazy"><figcaption><b>Familiar week and month navigation</b>Google Calendar. I used familiar calendar conventions to reduce the learning curve.</figcaption></figure>
<figure><img src="/assets/2c077b5f01499273145a36ce34378d2d.jpg" alt="Toggl Track week view with Goals and Favorites in a side panel" loading="lazy"><figcaption><b>A side panel beside the week</b>Toggl Track keeps goals next to the grid. This became the Today’s Tasks sidebar.</figcaption></figure>
<figure><img src="/assets/0004708fb6bb7075788c512f36da06f1.jpg" alt="Asana month calendar with a task bar spanning several days" loading="lazy"><figcaption><b>Multi-day items as bars</b>Asana. This shaped the all-day assignments row.</figcaption></figure>
<figure><img src="/assets/a29f5742276c6f793c88d7561d0911dd.jpg" alt="Amie week view with a to-do list beside the calendar" loading="lazy"><figcaption><b>Schedule plus tasks</b>Amie pairs events with to-dos, like sessions and assignments.</figcaption></figure>
</div>
<p class="hmw"><small>The opportunity</small>Students needed <strong>a connected view of their commitments</strong>, not another isolated destination.</p>
</section>

<!-- 3 DECISIONS -->
<section id="c3" class="jchap cs-sec">
<p class="jkick">03 · Making the decisions</p>
<h2 class="h2">How the Calendar took shape.</h2>

<article class="dec">
<p class="dnum">Decision A</p>
<h3 class="h3x">Three views for different planning needs.</h3>
<div class="pdt">
<div><p class="label">Problem</p><p>“What do I study today?” and “what’s coming up this week?” need different amounts of detail, which is hard to serve with one fixed layout.</p></div>
<div><p class="label">What I decided</p><p><strong>Day, Week and Month views over the same schedule</strong>, so students zoom in on today or out to the weeks ahead without changing tools.</p></div>
<div><p class="label">Trade-off</p><p>Three layouts of the same data to keep consistent, including how assignments and sessions show at each zoom level.</p></div>
</div>
<div class="cvt cs-wide">
<div role="tablist" aria-label="Calendar views" class="cvt-tabs">
<sc-for list="{{cvTabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" id="cvt-{{t.id}}" aria-selected="{{t.sel}}" aria-controls="cvt-panel" tabindex="{{t.ti}}" onClick="{{t.pick}}" class="cvt-tab {{t.cls}}">{{t.label}}</button></sc-for>
</div>
<figure id="cvt-panel" role="tabpanel" aria-labelledby="cvt-{{cvA.id}}" class="zfig cvt-panel"><div class="zw"><img src="{{cvA.src}}" alt="{{cvA.alt}}" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>{{cvA.label}}</b> · {{cvA.cap}}</figcaption></figure>
</div>
</article>

<article class="dec">
<p class="dnum">Decision B</p>
<h3 class="h3x">Separate Calendar and Assignments, keep them in sync.</h3>
<div class="pdt">
<div><p class="label">Problem</p><p>A time grid answers “when is class?” but not “what should I work on next?”.</p></div>
<div><p class="label">What I decided</p><p><strong>Calendar for when, Assignments for what next.</strong> Both show the same items and share one completion state, because one screen doing both jobs would have been harder to read.</p></div>
<div><p class="label">Trade-off</p><p>Two surfaces to keep aligned. <strong>Completion status needed to remain consistent across views.</strong></p></div>
</div>
<div class="shots-2 eq ca cs-wide">
<figure class="zfig "><div class="zw"><img src="/assets/5fcc5f411796e36b3e6fda55ccf61912.jpg" alt="Calendar tab, Week view: live and recorded sessions by hour, with an all-day row showing overdue and upcoming assignments" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Calendar</b> · when things happen</figcaption></figure>
<figure class="zfig "><div class="zw"><img src="/assets/456c826bfb9ba2f9e97aa0771896341f.jpg" alt="Assignments tab, Week filter: summary counts, an Overdue group first, then Today and each following day" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Assignments</b> · what to do next</figcaption></figure>
</div>
</article>

<article class="dec">
<p class="dnum">Decision C</p>
<h3 class="h3x">Make overdue work easier to spot and prioritize.</h3>
<div class="pdt">
<div><p class="label">Problem</p><p>Overdue work was listed by date, but each date was collapsed behind a completion count, and nothing placed it against the week ahead.</p></div>
<div><p class="label">What I decided</p><p>Overdue shows in <strong>three places, each with one job</strong>: status on the calendar, an Overdue group at the top of the list, and a dismissible alert.</p></div>
<div><p class="label">Trade-off</p><p>More red on screen. <strong>I used factual, non-judgmental status labels</strong>, like “1 day overdue”, to avoid punitive messaging.</p></div>
</div>
<ol class="odx cs-wide">
<li><div class="odx-t"><span class="odx-n">1</span><b>On the calendar</b><span>Overdue work turns red in the all-day row and on the month grid, with how late it is.</span></div>
<div class="odx-p odx-stack"><img src="/assets/87b8233cceaa1ff61d06a6f80b98af0c.png" alt="Week view all-day row: a red Assignments bar with 5/15 completed and 1 day overdue" style="max-width: 550px" loading="lazy"><img src="/assets/dde322b0c725a5e02386cdc1483d4143.png" alt="Month view: a red Overdue bar with 1/10 completed and 1 day overdue" style="max-width: 436px" loading="lazy"></div></li>
<li><div class="odx-t"><span class="odx-n">2</span><b>At the top of the list</b><span>In Assignments, an Overdue group sits above Today, and each item says how many days late it is.</span></div>
<div class="odx-p"><img src="/assets/7b5cafc68fc7d4e3f9c9fa7a5c909e69.png" alt="Assignments tab: Overdue group with 6 assignments, labelled 1 day overdue and 3 day overdue" loading="lazy"></div></li>
<li><div class="odx-t"><span class="odx-n">3</span><b>As an alert</b><span>A dismissible alert lists what’s overdue and links to the details.</span></div>
<div class="odx-p"><img src="/assets/b7922c63bcc79e7c29be4d17a0f276af.png" alt="Alert card: 3 assignment overdue, listing the assignments, with a View details button" style="max-width: 311px" loading="lazy"></div></li>
</ol>
</article>



<article class="dec">
<p class="dnum">Decision D · made with the PM and engineer</p>
<h3 class="h3x">Keep the first release focused.</h3>
<p class="lead">Calendars often let people drag items to new dates. But Live course assignments have <strong>fixed, instructor-set due dates</strong> shared by the whole class, so letting one student move them raised real questions about who owns the date and what stays in sync.</p>
<p class="lead">Together with the PM and engineer, we chose to <strong>keep V1 focused</strong>: students can see their assignments and live sessions in one place and mark work complete, but not reschedule course assignments. More complex capabilities, like rescheduling and integration with external calendars, were outside the original scope and could be explored later.</p>
</article>
</section>

<!-- 4 EXPERIENCE -->
<section id="c4" class="jchap cs-sec">
<p class="jkick">04 · Bringing the experience together</p>
<h2 class="h2">From seeing the schedule to acting on it.</h2>
<p class="lead">The Calendar works alongside the course pages students already use. Each decision became part of one flow: <strong>see what’s ahead, act on what’s next, and stay connected to the course</strong>.</p>

<div class="mo"><span>01</span><h3>See the bigger picture</h3></div>
<p class="lead">The Week view, with Today’s Tasks and upcoming live sessions beside the grid.</p>
<figure class="bleed cs-wide">
<div class="annot">
<img src="/assets/c4f1ea8579796185557d38cc9135b037.jpg" alt="Course Calendar, Week view with the overdue alert, Today’s Tasks, upcoming live sessions and the subject filter open">
<sc-for list="{{spots}}" as="sp" hint-placeholder-count="5"><span class="pin" style="left: {{sp.left}}; top: {{sp.top}}" aria-hidden="true">{{sp.n}}</span></sc-for>
</div>
<ol class="pins">
<sc-for list="{{spots}}" as="sp" hint-placeholder-count="5"><li><b>{{sp.n}}</b><span><strong>{{sp.title}}</strong> {{sp.body}}</span></li></sc-for>
</ol>
</figure>

<div class="mo"><span>02</span><h3>Know what to do next</h3></div>
<p class="lead">Clicking a day opens its assignments in a panel. Ticking one off updates <strong>the alert, the list and the week’s progress together</strong>.</p>
<figure class="zfig cs-wide"><div class="zw"><img src="/assets/d8c26110c36cae7b8abbef5afa452e87.jpg" alt="Day Panel open over the Month view: three assignments for the day, a 1 of 3 completed progress bar and one item checked off" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Day Panel</b> · a day’s work with progress</figcaption></figure>

<div class="mo"><span>03</span><h3>Stay connected to learning</h3></div>
<p class="lead">A calendar only helps if students find it. Instead of one new destination, I designed <strong>several ways in</strong>, starting from the pages students already use.</p>
<div class="shots-2 eq43 cs-wide">
<figure class="zfig"><div class="zw"><img src="/assets/c38a3f0294a0a6680098ee35b153c862.jpg" alt="Introducing Calendar pop-up on the dashboard: Everything you need, now in Calendar, with Explore Calendar and Maybe later buttons" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>1 · First visit</b> · a one-time pop-up on the dashboard, “Explore Calendar”</figcaption></figure>
<figure class="zfig"><div class="zw"><img src="/assets/32ea59f680adbab9400d3c45b83e7597.jpg" alt="Top bar with a Calendar button, and the profile menu open with Go to calendar" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>2 · Top bar</b> · a Calendar button, plus “Go to calendar” in the profile menu</figcaption></figure>
<figure class="zfig"><div class="zw"><img src="/assets/c9acbf103e0eccec156f07332b316133.jpg" alt="Course dashboard with the This week card and View Calendar, and Today’s assignments with Open full calendar" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>3 · Course dashboard</b> · “View Calendar” on the This week card, “Open full calendar” under today’s tasks</figcaption></figure>
<figure class="zfig"><div class="zw"><img src="/assets/425c394a26622c0d3a4cdd6854767b0b.jpg" alt="Learn page with a status strip for today and this week, and a View in Calendar button" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>4 · Learn page</b> · a status strip with “View in Calendar”</figcaption></figure>
</div>
<p class="note">The pop-up appears only the first time a student meets the Calendar on the dashboard, and not again after Explore Calendar. Today’s tasks and the This week card join the dashboard once they’ve explored it, on every screen size.</p>
<h3 class="h3x">A short tour on the first visit</h3>
<p class="lead">After students choose <strong>Explore Calendar</strong>, a four-step tour highlights one part of the page at a time, from the This week card to the calendar grid and Today’s tasks. It runs once and doesn’t appear again.</p>
<div class="shots-2 ob cs-wide">
<figure class="zfig"><div class="zw"><img src="/assets/a199fa454b256ea4fe771287b2493f65.jpg" alt="Onboarding step 1 of 4: the This week card highlighted, with a tooltip introducing the Calendar" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Step 1</b> · Meet your Calendar</figcaption></figure>
<figure class="zfig"><div class="zw"><img src="/assets/402926d1dbe2e37d212f760022237141.jpg" alt="Onboarding step 3 of 4: one week of the calendar grid highlighted, with overdue items in red" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Step 3</b> · See what’s due, when</figcaption></figure>
</div>
<div class="mo"><span>04</span><h3>Designed for every screen</h3></div>
<p class="lead">Students check their schedule on laptops, tablets and phones. The content stays the same; <strong>the layout reorders</strong> at each size. On desktop (shown above), Today’s tasks and live sessions sit in a sidebar.</p>
<div class="dev cs-wide">
<figure class="zfig dev-t"><div class="zw"><img src="/assets/a25a94378da641c318037e82f0e920c2.jpg" alt="Tablet Week view: overdue alert above the calendar, filters on their own row, Today’s Tasks and live sessions below the grid" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Tablet</b> · alert on top, tasks and sessions below</figcaption></figure>
<figure class="zfig dev-m"><div class="zw"><img src="/assets/b307af5a38a795a7f66938f058c09a6c.jpg" alt="Mobile Week view: This week card at the top, a full-width Day, Week and Month switcher, then the grid, Today’s Tasks and live sessions stacked" loading="lazy"><button type="button" class="zbtn" aria-label="Zoom image"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg></button></div><figcaption><b>Mobile</b> · one column, full-width view switcher</figcaption></figure>
</div>
</section>

<!-- 5 OUTCOME -->
<section id="c5" class="jchap cs-sec">
<p class="jkick">05 · Delivery, evaluation & reflection</p>
<h2 class="h2">What I delivered and how I’d evaluate it.</h2>
<p class="lead">I designed the Calendar’s Month, Week and Day views, the Assignments view and Day Panel, the overdue states, the entry points from the course dashboard and Learn page, the first-visit introduction, and layouts for desktop, tablet and mobile, working with the PM and front-end engineer, who built it.</p>
<p class="lead">The Calendar has <strong>launched for Live course students</strong>. Its impact hasn’t been evaluated yet, and the screens here are from my final designs, so details of the live product may differ.</p>
<h3 class="h3x">How I’d evaluate it</h3>
<p class="note">Proposed measures to evaluate the experience, not results.</p>
<div class="msr">
<div><b>Calendar adoption</b><span>Are Live students actually using the Calendar?</span></div>
<div><b>On-time completion</b><span>Are more assignments finished before their deadline?</span></div>
<div><b>Reduction in overdue work</b><span>Does the average number of overdue assignments drop?</span></div>
<div><b>Live-session engagement</b><span>Do students join, and recover missed classes through recordings?</span></div>
</div>
<p class="pull"><small>What I learned</small>Prioritization is part of the design. Working within real product constraints meant deciding what V1 should leave out, and keeping the first release focused on the information students already depended on: what’s due, what’s late and what’s next.</p>
</section>
